---
- name: Apply desired Loopback interface state
  hosts: routers
  gather_facts: false
  tasks:
    - name: Configure the requested interface
      cisco.ios.ios_config:
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
        parents: "interface {{ interface_name }}"
        defaults: true
        match: line
        save_when: changed
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
    - name: Set the interface administrative state
      cisco.ios.ios_config:
        lines: "{{ 'shutdown' if shutdown else 'no shutdown' }}"
        parents: "interface {{ interface_name }}"
        defaults: true
        match: line
        save_when: changed
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
